<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Russian Roulette AR</title>

  <!--
  COMPILER ORDER (index must match targetIndex below):
    0→00060  1→00113  2→00182  3→00225  4→00313  5→00342  6→00387  7→00806
  Source jpegs: any rr-*/image-targets/ (all identical)
  Output: russianroulette/image-targets/targets.mind
  Videos: rr-english/src/assets/  (swap folder for chinese/silent)
  -->

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // Picks a random quote video each time the wallpaper is found (the "roulette").
    // If the user hasn't tapped yet, the spin is queued and runs on the tap.
    AFRAME.registerComponent('video-roulette', {
      init() {
        const ids = ['#v0', '#v1', '#v2', '#v3', '#v4', '#v5', '#v6', '#v7'];
        const target = this.el.parentEl;
        let current = null;
        let visible = false;
        const spin = () => {
          if (!visible || !window.arUserReady) return;
          const pick = ids[Math.floor(Math.random() * ids.length)];
          if (current) current.pause();
          current = document.querySelector(pick);
          this.el.setAttribute('src', pick);
          current.muted = true;
          current.play().then(() => { current.muted = false; }).catch(() => {});
        };
        target.addEventListener('targetFound', () => { visible = true; spin(); });
        target.addEventListener('targetLost', () => { visible = false; if (current) current.pause(); });
        window.addEventListener('ar-user-ready', spin);
      }
    });

    // Counter-rotates the overlay to the nearest 90 degrees so it always reads
    // horizontally, whatever orientation the printed target happens to be in.
    AFRAME.registerComponent('keep-upright', {
      tick: function (t) {
        if (this._next && t < this._next) return;
        this._next = t + 300;
        const THREE = AFRAME.THREE;
        const targetObj = this.el.parentEl.object3D;
        const cam = this.el.sceneEl.camera;
        if (!cam || !targetObj.visible) return;
        const p0 = targetObj.localToWorld(new THREE.Vector3(0, 0, 0)).project(cam);
        const p1 = targetObj.localToWorld(new THREE.Vector3(1, 0, 0)).project(cam);
        const ang = Math.atan2(p1.y - p0.y, p1.x - p0.x);
        const snap = Math.round(ang / (Math.PI / 2)) * (Math.PI / 2);
        this.el.object3D.rotation.z = -snap;
      }
    });
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }

    #loading {
      position: fixed; inset: 0; z-index: 100;
      background: #000; color: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 14px; opacity: 0.6; letter-spacing: 0.03em; }

    #tap-start {
      position: fixed; inset: 0; z-index: 99;
      background: rgba(0,0,0,0.65);
      display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #tap-start.show { display: flex; }
    #tap-start p { font-size: 16px; text-align: center; padding: 0 32px; line-height: 1.5; opacity: 0.85; }
    #tap-start small { font-size: 12px; opacity: 0.5; }

    #cam-error {
      position: fixed; inset: 0; z-index: 101;
      background: #000; color: #fff;
      display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center; padding: 32px;
    }
    #cam-error.show { display: flex; }
    #cam-error h2 { font-size: 20px; font-weight: 600; }
    #cam-error p { font-size: 14px; opacity: 0.65; line-height: 1.6; max-width: 280px; }
    #cam-error button {
      margin-top: 8px; padding: 10px 24px;
      background: #fff; color: #000;
      border: none; border-radius: 20px; font-size: 14px; cursor: pointer;
    }

  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Starting camera…</p>
</div>

<div id="tap-start">
  <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
    <circle cx="28" cy="28" r="27" stroke="white" stroke-width="2" stroke-opacity="0.4"/>
    <polygon points="22,18 40,28 22,38" fill="white"/>
  </svg>
  <p>Point your camera at the artwork<br>and tap to enable sound</p>
  <small>Tap anywhere to continue</small>
</div>

<div id="cam-error">
  <h2>Camera Required</h2>
  <p>Allow camera access in your browser settings, then reload the page.</p>
  <button onclick="location.reload()">Reload</button>
</div>


<a-scene
  mindar-image="imageTargetSrc: russianroulette/image-targets/targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 2; missTolerance: 10; maxTrack: 1"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-assets>
    <!-- swap rr-english → rr-chinese or rr-silent for other languages -->
    <video id="v0" src="rr-english/src/assets/og3.mp4"  muted playsinline webkit-playsinline loop preload="auto" crossorigin="anonymous"></video>
    <video id="v1" src="rr-english/src/assets/og2.mp4"  muted playsinline webkit-playsinline loop preload="auto" crossorigin="anonymous"></video>
    <video id="v2" src="rr-english/src/assets/og9.mp4"  muted playsinline webkit-playsinline loop preload="auto" crossorigin="anonymous"></video>
    <video id="v3" src="rr-english/src/assets/og4.mp4"  muted playsinline webkit-playsinline loop preload="auto" crossorigin="anonymous"></video>
    <video id="v4" src="rr-english/src/assets/og6.mp4"  muted playsinline webkit-playsinline loop preload="auto" crossorigin="anonymous"></video>
    <video id="v5" src="rr-english/src/assets/og10.mp4" muted playsinline webkit-playsinline loop preload="auto" crossorigin="anonymous"></video>
    <video id="v6" src="rr-english/src/assets/og8.mp4"  muted playsinline webkit-playsinline loop preload="auto" crossorigin="anonymous"></video>
    <video id="v7" src="rr-english/src/assets/og7.mp4"  muted playsinline webkit-playsinline loop preload="auto" crossorigin="anonymous"></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- Single wallpaper target (full catalog page, compiled from a large crop).
       The wallpaper pattern repeats, so distinct per-medallion targets cross-match;
       instead one target spans several repeats and a random quote video plays
       each time it is found — the roulette. -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-video src="#v0" position="0 0 0.001" width="1.33" height="1" video-roulette keep-upright></a-video>
  </a-entity>
</a-scene>

<script>
  const scene    = document.querySelector('a-scene');
  const loading  = document.getElementById('loading');
  const tapStart = document.getElementById('tap-start');
  const camError = document.getElementById('cam-error');

  function ready() {
    loading.style.display = 'none';
    tapStart.classList.add('show');
  }

  scene.addEventListener('arReady', ready);
  scene.addEventListener('arError', () => { loading.style.display = 'none'; camError.classList.add('show'); });
  setTimeout(() => { if (loading.style.display !== 'none') ready(); }, 15000);

  tapStart.addEventListener('click', () => {
    tapStart.classList.remove('show');
    window.arUserReady = true;
    window.dispatchEvent(new Event('ar-user-ready'));
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { try { new AC().resume(); } catch(e) {} }
  });
</script>
</body>
</html>
